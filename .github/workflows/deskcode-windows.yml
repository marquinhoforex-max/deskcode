name: DeskCode Windows

on:
  workflow_dispatch:
  push:
    branches:
      - deskcode-gemini
    paths:
      - ".github/workflows/deskcode-windows.yml"
      - "custom/deskcode/**"
      - "script/build-deskcode.ps1"
      - "packages/opencode/**"
      - "packages/app/**"
      - "bun.lock"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native Windows binary
        working-directory: packages/opencode
        run: bun run script/build.ts --single --baseline

      - name: Assemble DeskCode package
        shell: pwsh
        run: |
          $source = "packages/opencode/dist/opencode-windows-x64-baseline/bin/opencode.exe"
          if (-not (Test-Path $source)) { throw "Binary not found: $source" }
          New-Item -ItemType Directory -Force -Path "release/DeskCode" | Out-Null
          Copy-Item $source "release/DeskCode/deskcode.exe"
          Copy-Item "custom/deskcode/opencode.jsonc" "release/DeskCode/opencode.jsonc"
          Copy-Item "custom/deskcode/.env.example" "release/DeskCode/.env.example"
          Copy-Item "custom/deskcode/deskcode.ps1" "release/DeskCode/deskcode.ps1"
          Copy-Item "custom/deskcode/DeskCode.cmd" "release/DeskCode/DeskCode.cmd"
          Copy-Item "custom/deskcode/README.pt-BR.md" "release/DeskCode/LEIA-ME.md"

      - name: Upload DeskCode
        uses: actions/upload-artifact@v4
        with:
          name: DeskCode-Windows-x64-Baseline
          path: release/DeskCode
          if-no-files-found: error
          retention-days: 30
